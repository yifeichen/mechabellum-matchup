<p class="meta">
  simple time to kill calculation (to implement damage ramping algorithem for steelballs and melting point)
</p>

<app-matrix-grid [columns]="units()" [cell]="cellFn" [sortValue]="sortValue" />

<p class="meta">
  colour: price-normalised time to kill based on matrix median
  @for (stop of legend(); track stop.distance) {
    <mat-basic-chip class="chip" [style.background]="stop.color">{{
      formatRatio(stop.ratio)
    }}</mat-basic-chip>
  }
</p>
